name: Publication privacy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extraction
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Check complete publication tree
        run: python3 scripts/check_publication.py
